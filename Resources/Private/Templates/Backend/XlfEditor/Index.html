<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbits="http://typo3.org/ns/PSBits/XlfEditor/ViewHelpers">
    <div
        class="panel-group"
        id="accordion-extensions">
        <f:for
            as="extensionFiles"
            each="{translations}"
            key="extensionKey">
            <div class="panel panel-default">
                <button
                    aria-controls="collapse-{extensionKey}"
                    aria-expanded="true"
                    class="list-group-item list-group-item-info"
                    data-parent="#accordion-extensions"
                    data-target="#collapse-{extensionKey}"
                    data-toggle="collapse">
                    {extensionKey}
                    <span
                        class="glyphicon glyphicon-menu-down pull-right"></span>
                </button>
                <div
                    aria-labelledby="{extensionKey}"
                    class="collapse"
                    data-parent="#accordion-extensions"
                    id="collapse-{extensionKey}">
                    <div class="panel-body">
                        <div
                            class="panel-group"
                            id="accordion-{extensionKey}">
                            <f:for
                                as="fileTranslations"
                                each="{extensionFiles}"
                                key="filePath">
                                <div class="panel panel-default">
                                    <f:variable
                                        name="filename"
                                        value="{psbits:getFilenameFromPath(path: filePath)}" />
                                    <button
                                        aria-controls="collapse-{extensionKey}"
                                        aria-expanded="true"
                                        class="list-group-item"
                                        data-target="#collapse-{extensionKey}-{filename}"
                                        data-toggle="collapse">
                                        <b>{filename}</b>
                                        ({psbits:getShortLanguageFilePath(path:
                                        filePath)})
                                    </button>
                                    <div
                                        aria-labelledby="{extensionKey}-{filename}"
                                        class="collapse collapsed"
                                        data-parent="#accordion-{extensionKey}"
                                        id="collapse-{extensionKey}-{filename}">
                                        <div class="panel-body">
                                            <f:form
                                                action="saveChanges"
                                                arguments="{filePath: filePath}">
                                                <f:for
                                                    as="translation"
                                                    each="{fileTranslations}"
                                                    key="locallangId">
                                                    <b>{locallangId}</b>
                                                    <f:for
                                                        as="value"
                                                        each="{translation}"
                                                        key="languageKey">
                                                        <div
                                                            class="form-control-wrap input-group">
                                                            <div
                                                                class="input-group-addon">
                                                                <span
                                                                    class="input-group-text"
                                                                    id="{extensionKey}-{filename}-{languageKey}-{locallangId}">
                                                                    {languageKey}
                                                                </span>
                                                            </div>
                                                            <f:form.textfield
                                                                additionalAttributes="{aria-describedby: '{extensionKey}-{filename}-{languageKey}-{locallangId}', aria-label: value}"
                                                                class="form-control"
                                                                name="labels[{languageKey}][{locallangId}]"
                                                                value="{value}" />
                                                        </div>
                                                    </f:for>
                                                </f:for>
                                                <button
                                                    class="btn btn-primary"
                                                    type="submit">
                                                    Submit
                                                </button>
                                            </f:form>
                                        </div>
                                    </div>
                                </div>
                            </f:for>
                        </div>
                    </div>
                </div>
            </div>
        </f:for>
    </div>
</html>
